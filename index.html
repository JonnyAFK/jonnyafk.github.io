<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>JonnyAFK — Hub</title>

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Varela+Round&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Shadows+Into+Light&display=swap" rel="stylesheet">

    <style>
        :root{
            --neon:#00f3d9;
            --neon-2:#00aaff;
            --bg:#000;
            --header-bg:#040405;
            --accent-blue:#0ea5ff;
            --hand-color:#f7fbff;
        }

        html,body{
            height:100%;
            margin:0;
            background:#000;
            font-family:Varela Round,system-ui,Arial;
            font-size:18px;
        }

        /* HEADER */
        .site-header{
            position:fixed;
            top:0; left:0; right:0;
            height:140px;
            background:linear-gradient(180deg,var(--header-bg),#000);
            border-bottom:1px solid rgba(255,255,255,0.03);
            z-index:100;
        }
        .header-inner{
            max-width:1360px;
            margin:0 auto;
            height:100%;
            display:flex;
            align-items:center;
            justify-content:space-between;
            padding:8px 28px;
        }
        .brand{
            height:220px;
            margin-top:-60px;
        }
        .brand-wrap{
            display:flex;
            align-items:center;
            gap:12px;
        }
        .handwritten{
            font-family:'Shadows Into Light',cursive;
            color:var(--hand-color);
            opacity:0.95;
            font-size:22px;
            display:flex;
            flex-direction:column;
            text-align:center;
            line-height:1;
        }
        .handline{
            font-size:14px;
            opacity:0.85;
            margin-top:4px;
        }

        /* NAV */
        .topnav{
            display:flex;
            gap:12px;
            align-items:center;
            flex-wrap:wrap;
        }
        .pill{
            display:inline-block;
            padding:12px 16px;
            border-radius:8px;
            background:rgba(0,0,0,0.45);
            border:1px solid rgba(0,170,255,0.05);
            color:var(--neon);
            text-decoration:none;
            font-weight:700;
            font-size:16px;
        }
        .pill:hover{
            box-shadow:0 10px 30px rgba(0,170,255,0.06);
        }
        .cta-app{
            background:linear-gradient(90deg,var(--accent-blue),var(--neon));
            color:#001;
            padding:14px 20px;
            font-size:17px;
            border:1px solid rgba(255,255,255,0.06);
            box-shadow:0 8px 30px rgba(14,165,255,0.12);
        }
        .discord-cta{
            background:linear-gradient(90deg,#5865F2,#7C88FF);
            color:#fff;
            font-weight:800;
            padding:12px 18px;
            border-radius:10px;
            border:1px solid rgba(255,255,255,0.06);
            box-shadow:0 14px 40px rgba(88,101,242,0.12);
            transition:transform .18s ease;
        }
        .discord-cta:hover{
            transform:translateY(-6px) scale(1.02);
        }

        /* HERO */
        .hero{
            position:relative;
            min-height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
            overflow:hidden;
            background:#000;
            padding-top:140px;
        }
        .overlay{
            position:absolute;
            inset:0;
            background:linear-gradient(180deg,rgba(0,0,0,0.25),rgba(0,0,0,0.6));
            backdrop-filter:blur(2px);
            z-index:2;
        }

        /* MEDIA FRAME */
        .media-frame{
            position:relative;
            z-index:40;
            width:min(1088px,73.6vw);
            aspect-ratio:16/9;
            background:rgba(0,0,0,0.72);
            padding:24px;
            border-radius:6px;
            border:32px solid #07080a;
            box-shadow:0 10px 80px rgba(0,0,0,0.85);
            overflow:hidden;
        }
        .media{
            width:100%;
            height:100%;
            object-fit:cover;
            border-radius:6px;
            background:#000;
        }
        .bg-video{
            position:absolute;
            inset:0;
            width:100%;
            height:100%;
            object-fit:cover;
            z-index:1;
            filter:brightness(.55);
            pointer-events:none;
        }

        /* GEARS — now behind everything */
        .gear-wrapper{
            position:fixed;
            inset:0;
            pointer-events:none;
            z-index:0;
        }

        /* SOCIAL BAR */
        .social-bar{
            position:fixed;
            left:0; right:0;
            bottom:64px;
            display:flex;
            justify-content:center;
            gap:12px;
            z-index:110;
        }
        .social-btn{
            padding:10px 16px;
            border-radius:999px;
            background:rgba(255,255,255,0.02);
            color:var(--neon);
            text-decoration:none;
            border:1px solid rgba(255,255,255,0.03);
            font-weight:700;
            font-size:15px;
        }

        /* FOOTER */
        footer{
            position:fixed;
            left:0; right:0;
            bottom:12px;
            text-align:center;
            color:var(--hand-color);
            opacity:0.95;
            font-size:18px;
            font-family:'Shadows Into Light',cursive;
            z-index:400;
        }
    </style>
</head>

<body>

    <!-- HEADER -->
    <header class="site-header">
        <div class="header-inner">
            <div class="brand-wrap">
                <img src="JonnyAFK Clear Background.png" class="brand" alt="JonnyAFK">
                <div class="handwritten">
                    <div>Music · Art · Shenanigans</div>
                    <div class="handline">All in one hub</div>
                </div>
            </div>

            <nav class="topnav">
                <a class="pill" href="music.html">Music</a>
                <a class="pill" href="art.html">Art</a>
                <a class="pill" href="merch.html">Merch</a>
                <a class="pill" href="apps.html">Apps</a>
                <a class="pill" href="about.html">About</a>
                <a class="pill" href="contact.html">Contact</a>

                <!-- Song Maker CTA -->
                <a class="pill cta-app" href="https://your-song-maker.base44.app" target="_blank" rel="noopener">

                <!-- Discord -->
                <a id="discordCTA" class="discord-cta" href="https://discord.gg/WMFDqpyvhc" target="_blank" rel="noopener">

    <!-- HERO -->
    <main class="hero" id="hero">

    <!-- SOCIAL -->
    <div class="social-bar">
        <a class="social-btn" href="https://www.youtube.com/@jonnyafk" target="_blank">YouTube</a>
        <a class="social-btn" href="https://discord.gg/WMFDqpyvhc" target="_blank">Discord</a>
        <a class="social-btn" href="https://music.youtube.com/search?q=jonnyafk" target="_blank">YT Music</a>
        <a class="social-btn" href="https://open.spotify.com/search/jonnyafk" target="_blank">Spotify</a>
        <a class="social-btn" href="https://www.instagram.com/jonny_afk" target="_blank">Instagram</a>
        <a class="social-btn" href="https://www.tiktok.com/@jonny_afk0" target="_blank">TikTok</a>
        <a class="social-btn" href="https://www.pandora.com/search/jonnyafk" target="_blank">Pandora</a>

        <a class="social-btn" href="mailto:jonnyafk@hotmail.com">Email</a>
    </div>

    <!-- FOOTER -->
    <footer>
        © JonnyAFK — Built with love
    </footer>

    <!-- AUDIO -->
    <audio id="bgAudio" src="the song.mp3" loop preload="auto"></audio>

    <!-- JS -->
    <script>
        /* PARALLAX HEADER LOGO */
        const hero = document.getElementById('hero');
        const headerLogo = document.querySelector('.brand');
        hero.addEventListener('mousemove', e=>{
            const rect = hero.getBoundingClientRect();
            const px = (e.clientX - rect.left) / rect.width - 0.5;
            const py = (e.clientY - rect.top) / rect.height - 0.5;
            headerLogo.style.transform = `translate3d(${px*10}px,${py*6}px,0) rotate(${px*2}deg)`;
        });
        hero.addEventListener('mouseleave', ()=>{
            headerLogo.style.transform='translate3d(0,0,0)';
        });

        /* MOBILE VIDEO PAUSE */
        const bgVid = document.getElementById('backgroundVideo');
        if(window.matchMedia('(max-width:600px)').matches){
            if(bgVid) bgVid.pause();
        }

        /* SCROLL FORWARDING */
        const forwardScroll = el=>{
            el.addEventListener('wheel', e=>{
                e.preventDefault();
                window.scrollBy({top:e.deltaY});
            }, {passive:false});
        };
        forwardScroll(document.getElementById('heroMedia'));
        forwardScroll(document.getElementById('mediaFrame'));

        /* GEARS — behind everything */
        (function(){
            const pairs = [
                {files:['gear4.png','gear2.png'], anchor:'top-right', sizes:[220,140]},
                {files:['gear1.png','gear3.png'], anchor:'left-middle', sizes:[220,140]}
            ];

            const wrapper = document.createElement('div');
            wrapper.className = 'gear-wrapper';
            document.body.appendChild(wrapper);

            const created = [];

            pairs.forEach(p=>{
                const cont = document.createElement('div');
                cont.style.position='fixed';
                cont.style.zIndex='0'; /* FIXED */
                cont.style.pointerEvents='none';

                if(p.anchor==='top-right'){
                    cont.style.right='48px';
                    cont.style.top='22px';
                } else {
                    cont.style.left='48px';
                    cont.style.bottom='120px';
                }

                const g1 = new Image();
                const g2 = new Image();
                g1.className='gear-item';
                g2.className='gear-item';

                const sizeA = p.sizes[0];
                const sizeB = p.sizes[1];

                g1.style.width=sizeA+'px';
                g2.style.width=sizeB+'px';

                const containerW = sizeA + sizeB*0.8;
                const containerH = Math.max(sizeA,sizeB)+20;
                cont.style.width=containerW+'px';
                cont.style.height=containerH+'px';

                g1.style.left='0px';
                g1.style.top=(containerH-sizeA)/2+'px';

                const overlap=0.36;
                g2.style.left=(sizeA-sizeB*overlap)+'px';
                g2.style.top=(containerH-sizeB)/2+'px';

                g1.src=encodeURI(p.files[0]);
                g2.src=encodeURI(p.files[1]);

                cont.appendChild(g1);
                cont.appendChild(g2);
                wrapper.appendChild(cont);

                created.push({g1,g2,sizeA,sizeB});
            });

            const TICK_MS=100;
            const PERIOD_MS=1000;
            const TICK_ANGLE=18;

            function tick(){
                created.forEach(pair=>{
                    const {g1,g2,sizeA,sizeB}=pair;
                    const deltaA=TICK_ANGLE;
                    const deltaB=-(deltaA*(sizeA/sizeB));

                    g1.dataset.angle=(parseFloat(g1.dataset.angle||0)+deltaA)%360;
                    g2.dataset.angle=(parseFloat(g2.dataset.angle||0)+deltaB)%360;

                    g1.style.transition=`transform ${TICK_MS}ms linear`;
                    g2.style.transition=`transform ${TICK_MS}ms linear`;

                    g1.style.transform=`rotate(${g1.dataset.angle}deg)`;
                    g2.style.transform=`rotate(${g2.dataset.angle}deg)`;

                    setTimeout(()=>{
                        g1.style.transition='none';
                        g2.style.transition='none';
                    },TICK_MS+10);
                });
            }

            setTimeout(()=>{ tick(); setInterval(tick,PERIOD_MS); },360);
        })();
    </script>

</body>
</html>
