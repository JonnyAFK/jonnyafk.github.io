<h1>How to Delete Your Account</h1>
<p>You can delete your account inside the Let’s Play app by going to Profile → Delete Account.</p>
<p>If you have uninstalled the app or cannot access your account, email <a href="mailto:jonnyafk@hotmail.com">jonnyafk@hotmail.com</a> to request deletion.</p>
